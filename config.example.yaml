# =============================================================================
# Benchforge 設定テンプレート
#   初回起動時に、これが config.yaml として自動でコピーされます（自分でコピーする必要はありません）。
#   設定を変えるときは config.yaml のほうを編集し、Benchforge を起動し直してください
#   （設定は起動したときにしか読み込まれません）。
# =============================================================================

input:
  # 成績データ（results ディレクトリ）の場所。
  #   ★既定は「同梱のサンプルデータ」を指しています。入れた直後から画面が動きます。
  #   自分の問題は データセット/your_data/inbox/ に置けば、各タブの「問題セット」で選べます
  #   （ここを書き換える必要はありません。書き方は データセット/README.md）。
  #   アプリの外にデータを置きたいときだけ書き換えます。
  #   相対パスは Benchforge のフォルダ起点。別の場所なら絶対パス（例: C:/path/to/results）。
  results_dir: データセット/chest_demo/results
  # 問題ビューア用の問題ディレクトリ（本文・画像・読み取り専用・任意）。
  #   空なら本体データの問題ビューアは無効（自前データセットの問題は同梱ぶんを表示）。
  questions_dir: ""

server:
  host: 127.0.0.1     # ローカルのみ。同じネットワークの他端末に見せるなら 0.0.0.0
  port: 8095

# AI（ollama）の接続先。ollama は別途インストール・起動が必要です。
#   同じ PC に入れた場合はこのままで構いません。
#   Docker や別の PC で動かしている場合だけ書き換えます（README「ollama を別の場所で動かしている場合」）。
ollama:
  url: http://localhost:11434


data:
  plans_dir: data/plans   # 作成した構成(JSON)の保存先（Benchforge/ 相対・自分の領域のみ）

# 問題を解かせる仕組み。
runner:
  # standalone = このアプリだけで完結（既定。通常はこのまま）
  # radbench   = 別に用意した実行系と連携させるための開発用の値（通常は使いません）
  backend: standalone
